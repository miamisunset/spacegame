too-many-lines-threshold = 100    # clippy::too_many_lines (denied)
cognitive-complexity-threshold = 25 # clippy::cognitive_complexity (denied)
excessive-nesting-threshold = 3     # clippy::excessive_nesting (denied)
type-complexity-threshold = 250   # clippy::type_complexity (denied)
too-many-arguments-threshold = 7  # clippy::too_many_arguments (denied)
max-fn-params-bools = 3           # clippy::fn_params_excessive_bools (denied)
max-struct-bools = 3              # clippy::struct_excessive_bools (denied)
array-size-threshold = 16384      # clippy::large_stack_arrays (denied)
enum-variant-size-threshold = 200 # clippy::large_enum_variant (denied)
large-error-threshold = 128       # clippy::result_large_err (denied)
